<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    
    <main class="container">
        <h1 class="title">BMI Calculator</h1>
        <div class="input-group">
            <section class="input-box">
                <label for="weightInput">Weight (kg)</label>
                <input type="number" id="weightInput">
            </section>
            <section class="input-box">
                <label for="heightInput">Height (cm)</label>
                <input type="number" id="heightInput">
            </section>
        </div>
        
        <div class="result-box">
            <h1 class="bmi-score" id="resultBmiScore">0</h1>
            <h3 class="bmi-category" id="resultBmiCategory">N/A</h3>
        </div>

        <div class="bmi-range-group">
            <section class="underweight">
                <div class="bmi-line"></div>
                <h5 class="bmi-label">Underweight</h5>
                <h4 class="bmi-number">&lt; 18.5</h4>
            </section>

            <section class="normal">
                <div class="bmi-line"></div>
                <h5 class="bmi-label">Normal</h5>
                <h4 class="bmi-number">18.5 - 24.9</h4>
            </section>

            <section class="overweight">
                <div class="bmi-line"></div>
                <h5 class="bmi-label">Overweight</h5>
                <h4 class="bmi-number">25 - 29.9</h4>
            </section>

            <section class="obese">
                <div class="bmi-line"></div>
                <h5 class="bmi-label">Obese</h5>
                <h4 class="bmi-number">&gt; 30</h4>
            </section>

            <div class="bmi-indicator" id="bmiIndicator"></div>
        </div>

        <div class="button-group">
            <button class="reset-button" id="resetBtn">Reset</button>
            <button class="calculate-button" id="calculateBtn">Calculate</button>
        </div>
    </main>

    <script src="./js/script.js"></script>
</body>
</html>

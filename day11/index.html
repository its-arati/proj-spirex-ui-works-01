<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Mart</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/@yaireo/tagify/dist/tagify.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <header class="container-fluid m-0 bg-dark">
        <nav class="navbar navbar-expand-lg navbar-dark">
            <div class="container-fluid">
                <a class="navbar-brand fw-bold" href="#">Umazon.in</a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent"
                    aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarContent">
                    <form method="get" class="d-flex mx-auto my-2 my-lg-0 col-12 col-lg-6" role="search">
                        <input class="form-control me-2" type="search" name="q" placeholder="Search products...Clothing, Laptops..."
                            aria-label="Search">
                        <button class="btn btn-outline-success" type="submit">Search</button>
                    </form>

                    <div class="d-flex justify-content-end">
                        <button class="btn btn-primary d-flex align-items-center gap-2" id="cart-open" type="button">
                            <i class="fa-solid fa-cart-shopping" style="color: rgb(226, 255, 225);"></i>
                            <span>Cart</span>
                            <span id="cart-size" class="badge bg-danger rounded-pill"></span>
                        </button>
                    </div>
                </div>
            </div>
        </nav>

    </header>
    <main class="container-fluid">
        <div class="item-list d-flex row justify-content-center" id="item-list">
        </div>
    </main>

    <aside class="cart-section d-flex flex-column bg-white shadow" id="cart"
        style="width: 350px; height: 100vh; position: fixed; top: 0; right: 0; z-index: 1050;">

        <div class="d-flex justify-content-between align-items-center p-3 border-bottom">
            <h5 class="mb-0 fw-bold">Shopping Cart</h5>
            <button type="button" class="btn-close" id="cart-close" aria-label="Close"></button>
        </div>

        <div id="cart-list" class="flex-grow-1 p-3" style="overflow-y: auto;">

        </div>

        <div class="p-3 border-top mt-auto bg-light">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <span class="text-muted fw-medium">Total:</span>
                <span id="cart-total" class="fs-5 fw-bold text-success"></span>
            </div>

            <button class="btn btn-success w-100 py-2 fw-bold text-uppercase" type="button">
                Proceed to Checkout
            </button>
        </div>

    </aside>



    <script src="https://cdn.jsdelivr.net/npm/@yaireo/tagify"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>

    <script src="./js/script.js"></script>
</body>

</html>

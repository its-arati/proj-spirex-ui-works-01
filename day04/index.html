<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <link rel="stylesheet" href="./css/page.css">
    <link rel="stylesheet" href="./css/form.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>

<body>
    <header class="header">
        <nav>
            <div class="nav-logo">
                <h1>Interia Studio</h1>
            </div>
            <div class="nav-links">
                <ul id="menu">
                    <li>Home</li>
                    <li>Designs</li>
                    <li>Appointment</li>
                    <li>About</li>
                    <li>Contact</li>
                </ul>
            </div>
            <div class="nav-btn">
                <img src="https://t4.ftcdn.net/jpg/02/29/75/83/360_F_229758328_7x8jwCwjtBMmC6rgFzLFhZoEpLobB6L8.jpg"
                    onclick="openAuthModal('login')">
                <button id="login" onclick="login()">Login</button>
                <button id="register" onclick="register()">Register</button>
                <i class="fa fa-bars" id="menuIcon" onclick="openMenu()"></i>
                <i class="fa fa-times-circle" id="closeIcon" onclick="closeMenu()"></i>
            </div>
        </nav>
    </header>

    <div class="modal-overlay" id="authModal">
        <div class="modal-box">
            <i class="fa fa-times-circle" id="modalClose" onclick="closeAuthModal()"></i>
            <div class="auth-form" id="loginFormContainer">
                <h2>Welcome Back!</h2>
                <form onsubmit="handleLogin(event)">
                    <div class="input-section">
                        <i class="fa fa-envelope input-icon"></i>
                        <input type="email" placeholder="Enter your email" required>
                    </div>
                    <div class="input-section">
                        <i class="fa fa-lock input-icon"></i>
                        <input type="password" placeholder="Enter your password" required>
                    </div>
                    <button type="submit" class="submit-btn">Login</button>
                </form>
                <p class="switch-text">Don't have an account? <a href="#" onclick="toggleForm('register')">Register</a>
                </p>
            </div>

            <div class="auth-form hidden" id="registerFormContainer">
                <h2>Create Account</h2>
                <form onsubmit="handleRegister(event)">
                    <div class="input-section">
                        <i class="fa fa-user input-icon"></i>
                        <input type="text" placeholder="Enter your name" required>
                    </div>
                    <div class="input-section">
                        <i class="fa fa-envelope input-icon"></i>
                        <input type="email" placeholder="Enter your email" required>
                    </div>
                    <div class="input-section">
                        <i class="fa fa-lock input-icon"></i>
                        <input type="password" placeholder="Enter your password" required>
                    </div>
                    <button type="submit" class="submit-btn">Submit</button>
                </form>
            </div>

            <div class="custom-alert-overlay" id="customAlert">
                <div class="custom-alert-box">
                    <div class="alert-icon">
                        <i class="fa fa-check-circle"></i>
                    </div>
                    <h3 id="alertTitle">Notification</h3>
                    <p id="alertMessage">Message</p>
                    <button class="alert-btn" onclick="closeCustomAlert()">Dismiss</button>
                </div>
            </div>

        </div>
    </div>

    <script src="./js/script.js"></script>
</body>

</html>

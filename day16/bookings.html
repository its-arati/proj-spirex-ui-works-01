<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">

</head>

<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"><i class="bi bi-calendar2-event-fill"></i> EventHub</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="nav justify-content-end">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="./index.html">Events</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="./bookings.html">My Registrations</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid content">
        <h2 class="text-center ">My Registrations</h2>
        <h3 class="text-center ">Every event you've registered for, in one place.</h3>
    </div>

    <main class="container main">
        <div id="bookingsList" class="d-flex flex-column gap-3"></div>

        <div id="bookingsEmpty" class="empty d-none">
            <i class="bi bi-ticket-perforated-fill"></i>
            <p>No bookings yet.</p>
            <p class="empty-sub">Events you register for will show up here.</p>
            <a href="index.html" class="btn btn-primary mt-2">Explore events</a>
        </div>
    </main>

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="Toast" class="toast align-items-center" role="alert">
            <div class="d-flex">
                <div class="toast-body" id="ToastBody">Done.</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/script.js"></script>
</body>

</html>

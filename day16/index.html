<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">

</head>

<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"><i class="bi bi-calendar2-event-fill"></i> EventHub</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="nav justify-content-end">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="./index.html">Events</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="./bookings.html">My Registrations
                            <span id="bookingCountBadge" class="badge badge-count d-none">0</span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid content">
        <h2 class="text-center ">Find your next event.</h2>
        <h3 class="text-center ">Tech meetups, festivals, workshops and more — register now.</h3>
    </div>

    <div class="container">
        <div class="filter-row" id="categoryFilters">
            <button class="filter active" data-category="all">All</button>
        </div>
    </div>
    <main class="container main">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <span class="section-label">All events</span>
            <span class="result-count" id="resultCount"></span>
        </div>
        <div id="eventGrid" class="row g-4"></div>
        <div id="emptyState" class="empty d-none">
            <i class="bi bi-emoji-frown-fill"></i>
            <p>No events to show.</p>
        </div>
    </main>

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="Toast" class="toast align-items-center" role="alert">
            <div class="d-flex">
                <div class="toast-body" id="ToastBody">Done.</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <div class="modal fade" id="registerModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Register for this event</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="registerForm" novalidate>
                    <div class="modal-body">
                        <input type="hidden" id="regEventId">
                        <p class="modal-event" id="regEventName"></p>

                        <div class="mb-3">
                            <label class="form-label" for="regName">Full name</label>
                            <input type="text" class="form-control" id="regName" required>
                            <div class="invalid-feedback">Please enter your name.</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="regEmail">Email address</label>
                            <input type="email" class="form-control" id="regEmail" required>
                            <div class="invalid-feedback">Please enter a valid email.</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="regPhone">Phone number</label>
                            <input type="tel" class="form-control" id="regPhone" pattern="[0-9]{10}" required>
                            <div class="invalid-feedback">Please enter a 10-digit phone number.</div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Confirm registration</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/script.js"></script>
</body>

</html>

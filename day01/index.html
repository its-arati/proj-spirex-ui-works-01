<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpireX Portfolio Card</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="./css/portfolio-card.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Style+Script&display=swap"
        rel="stylesheet">
</head>

<body>
    <article class="portfolio-card">
        <aside class="card-sidebar">
            <div class="photo-wrapper">
                <img src="https://as2.ftcdn.net/v2/jpg/09/37/59/63/1000_F_937596342_KHbYukUijKHY02pdJEugcWAqfbJXyxhy.webp"
                    alt="Profile Photo" class="profile-photo">
            </div>
            <h1 class="user-name archivo-black-regular">Km Arati Maurya</h1>
            <p class="user-role">Frontend Developer</p>
            <div class="user-details">
                <p class="detail-item">MCA</p>
                <p class="detail-item">
                    <i class="fa fa-map-marker"></i>
                    Kolkata
                </p>
            </div>
        </aside>
        <main class="card-main">
            <section class="info-section">
                <h2 class="section-title">About Me</h2>
                <p class="card-text-content">
                    I build responsive web applications using HTML, CSS, JavaScript, and modern frameworks like React.
                    I focus on writing clean, maintainable code that scales smoothly.
                </p>
            </section>
            <section class="info-section">
                <h2 class="section-title">Skills</h2>
                <div class="skills-list">
                    <span class="skill-badge">HTML5</span>
                    <span class="skill-badge">CSS</span>
                    <span class="skill-badge">JavaScript</span>
                    <span class="skill-badge">Tailwind CSS</span>
                </div>
            </section>
            <section class="info-section contact-section">
                <h2 class="section-title">Contact</h2>
                <div class="contact">
                    <a href="#" class="social-icon envelope" target="_blank">
                        <i class="fa fa-envelope"></i>
                    </a>
                    <a href="#" class="social-icon github" target="_blank">
                        <i class="fa fa-github"></i>
                    </a>
                    <a href="#" class="social-icon github" target="_blank">
                        <i class="fa fa-linkedin-square"></i>
                    </a>
                </div>

            </section>
        </main>
    </article>
</body>

</html>

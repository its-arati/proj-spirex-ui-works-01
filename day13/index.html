<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Applied.in</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <career-pulse-controller>

        <div slot="header">
            <app-navbar></app-navbar>

            <main class="container my-4">
                <div class="row align-items-center mb-4">
                    <div class="col-md-6 text-center text-md-start">
                        <h1 class="h3 fw-bold text-dark m-0">Job Application Tracker</h1>
                        <p class="text-muted small m-0">
                            Track, analyze, and optimize your interview pipelines
                        </p>
                    </div>

                    <div class="col-md-6 text-center text-md-end mt-3 mt-md-0">
                        <new-application-button></new-application-button>
                    </div>
                </div>
            </main>

        </div>


        <div slot="metrics">

            <div class="container">
                <app-dashboard-stats></app-dashboard-stats>
            </div>

        </div>


        <div slot="applications">

            <div class="container">
                <div class="row g-4">

                    <div class="col-xl-8">

                        <div class="card border-0 shadow-sm">

                            <div class="card-header bg-white border-0 pt-4 pb-0 d-flex justify-content-between align-items-center">
                                <h5 class="fw-bold m-0 text-dark">Active Pipelines</h5>
                                <application-filter></application-filter>
                            </div>

                            <application-table></application-table>

                        </div>

                    </div>


                    <div class="col-xl-4">

                        <div class="card border-0 shadow-sm mb-4">

                            <div class="card-header bg-white border-0 pt-4 pb-2">
                                <h5 class="fw-bold m-0 text-dark">Pipeline Funnel</h5>
                            </div>

                            <div class="card-body">

                                <div class="mb-3">
                                    <div class="d-flex justify-content-between small mb-1">
                                        <span class="text-muted fw-semibold">Screening Call</span>
                                        <span class="text-dark fw-bold">18</span>
                                    </div>

                                    <div class="progress" style="height: 8px;">
                                        <div class="progress-bar bg-primary" role="progressbar" style="width: 100%"></div>
                                    </div>
                                </div>


                                <div class="mb-3">
                                    <div class="d-flex justify-content-between small mb-1">
                                        <span class="text-muted fw-semibold">Technical Round</span>
                                        <span class="text-dark fw-bold">9</span>
                                    </div>

                                    <div class="progress" style="height: 8px;">
                                        <div class="progress-bar bg-primary bg-opacity-75" role="progressbar" style="width: 50%"></div>
                                    </div>
                                </div>


                                <div class="mb-3">
                                    <div class="d-flex justify-content-between small mb-1">
                                        <span class="text-muted fw-semibold">HM Interview</span>
                                        <span class="text-dark fw-bold">6</span>
                                    </div>

                                    <div class="progress" style="height: 8px;">
                                        <div class="progress-bar bg-primary bg-opacity-50" role="progressbar" style="width: 33%"></div>
                                    </div>
                                </div>


                                <div class="mb-0">
                                    <div class="d-flex justify-content-between small mb-1">
                                        <span class="text-muted fw-semibold">HR Round</span>
                                        <span class="text-dark fw-bold">3</span>
                                    </div>

                                    <div class="progress" style="height: 8px;">
                                        <div class="progress-bar bg-primary bg-opacity-25" role="progressbar" style="width: 17%"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </career-pulse-controller>
    <script src="/scripts/mini-ui.js"></script>
    <script src="./js/script.js"></script>
    <script src="./js/new-application.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Palette Generator</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <div class="container">

        <h1><img src="./Image.png">Color Palette Generator</h1>

        <div class="picker-wrapper">
            <label for="colorPicker" class="colorpicker">Choose Base Color:</label>
            <input type="color" id="colorPicker" value="#3498db">
        </div>
        <p>Click the above box and choose your base color</p>

        <button id="generateBtn">Generate Palette</button>
        <div id="colorPalette">
            <!--<div class="color-card">
                <span class="color-code">#ei4j56</span>
            </div> -->
        </div>
    </div>

    <script src="./js/script2.js"></script>
</body>
</html>

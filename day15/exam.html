<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Online Exam - Assessment</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav class="navbar navbar-expand bg-white border-bottom shadow-sm sticky-top">
    <div class="container-fluid px-4">
      <span class="navbar-brand fw-bold text-primary mb-0">
        <i class="bi bi-mortarboard-fill me-2"></i>Online Exam
      </span>
      <div class="d-flex align-items-center gap-3">
        <span class="fw-semibold d-none d-sm-inline" id="user-display">Candidate</span>
        <exam-timer></exam-timer>
      </div>
    </div>
  </nav>

  <div class="container-fluid px-4 py-4">
    <div class="row g-4">
      
      <div class="col-lg-8">
        <div class="card shadow-sm border-0 h-100 d-flex flex-column">
          
          <active-question class="d-flex flex-column flex-grow-1"></active-question>

          <div class="card-footer bg-white py-3 border-top d-flex justify-content-between flex-wrap gap-2">
            <div>
              <button type="button" class="btn btn-outline-warning text-dark me-2" onclick="store.toggleReview()">
                <i class="bi bi-flag"></i> Mark for Review
              </button>
              <button type="button" class="btn btn-outline-secondary" onclick="store.clearAnswer()">
                Clear Selection
              </button>
            </div>
            <div class="d-flex gap-2">
              <button type="button" class="btn btn-outline-primary px-3" id="btn-prev" onclick="store.prev()">
                <i class="bi bi-arrow-left"></i> Previous
              </button>
              <button type="button" class="btn btn-primary px-3" id="btn-next" onclick="store.next()">
                Next <i class="bi bi-arrow-right"></i>
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="col-lg-4">
        <div class="card shadow-sm border-0">
          <div class="card-header bg-white py-3">
            <h5 class="mb-0 fw-bold">Question Palette</h5>
          </div>
          <div class="card-body p-3">
            <div class="row g-2 small mb-3">
              <div class="col-6 d-flex align-items-center">
                <span class="legend-badge bg-success"></span> Attempted
              </div>
              <div class="col-6 d-flex align-items-center">
                <span class="legend-badge bg-danger"></span> Not Attempted
              </div>
              <div class="col-6 d-flex align-items-center">
                <span class="legend-badge bg-warning"></span> Marked for Review
              </div>
              <div class="col-6 d-flex align-items-center">
                <span class="legend-badge bg-light border"></span> Unvisited
              </div>
            </div>

            <hr />

            <question-palette></question-palette>

            <hr />

            <palette-counters></palette-counters>

            <div class="d-grid mt-4">
              <button type="button" class="btn btn-danger btn-lg fw-bold" onclick="store.submit()">
                Submit Examination
              </button>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="/scripts/mini-ui.js"></script>
  <script src="js/exam.js"></script>
</body>
</html>

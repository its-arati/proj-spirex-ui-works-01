<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Online Exam - Results</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-6 col-md-8">
        <div class="card shadow border-0 text-center">
          <div class="card-header bg-success text-white py-4">
            <i class="bi bi-award-fill fs-1"></i>
            <h3 class="mt-2 fw-bold">Assessment Completed</h3>
          </div>
          <div class="card-body p-4">
            <h4 class="fw-bold text-dark mb-1" id="res-greeting">Congratulations!</h4>
            <p class="text-muted mb-4">Here is your final performance summary:</p>

            <div class="p-4 bg-light rounded-3 border mb-4">
              <div class="text-muted text-uppercase fw-semibold small">Final Score</div>
              <div class="display-4 fw-bold text-primary my-1" id="res-score">0 / 0</div>
              <div class="fw-semibold text-muted" id="res-percentage">0% Marks</div>
            </div>

            <div class="row g-2 text-start mb-4">
              <div class="col-6">
                <div class="p-3 border rounded">
                  <div class="small text-muted">Correct Answers</div>
                  <div class="h5 fw-bold text-success mb-0" id="res-correct">0</div>
                </div>
              </div>
              <div class="col-6">
                <div class="p-3 border rounded">
                  <div class="small text-muted">Incorrect Answers</div>
                  <div class="h5 fw-bold text-danger mb-0" id="res-incorrect">0</div>
                </div>
              </div>
              <div class="col-6">
                <div class="p-3 border rounded">
                  <div class="small text-muted">Unattempted</div>
                  <div class="h5 fw-bold text-secondary mb-0" id="res-unattempted">0</div>
                </div>
              </div>
              <div class="col-6">
                <div class="p-3 border rounded">
                  <div class="small text-muted">Total Questions</div>
                  <div class="h5 fw-bold text-dark mb-0" id="res-total">0</div>
                </div>
              </div>
            </div>

            <div class="d-grid">
              <a href="index.html" class="btn btn-outline-primary fw-semibold">
                <i class="bi bi-arrow-clockwise me-1"></i> Retake Test
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/scripts/mini-ui.js"></script>
  <script>
    window.addEventListener("DOMContentLoaded", async () => {
      const name = localStorage.getItem("candidate_name") || "Candidate";
      const qStore = new FakeDatastore("exam_questions_store", "questions.json");
      const aStore = new FakeDatastore("exam_answers", "questions.json");

      const questions = await qStore.defaultValue() || [];
      const userAnswers = await aStore.defaultValue() || [];

      console.log(questions, userAnswers)

      let correct = 0;
      let incorrect = 0;

      questions.forEach((q) => {
        const found = userAnswers.find(a => a.qId == q.id);
        if (found) {
          if (found.selectedOption == q.correctIndex) correct++;
          else incorrect++;
        }
      });

      const total = questions.length;
      const unattempted = total - (correct + incorrect);
      const percentage = Math.round((correct / total) * 100);

      document.getElementById("res-greeting").textContent = `Congratulations, ${name}!`;
      document.getElementById("res-score").textContent = `${correct} / ${total}`;
      document.getElementById("res-percentage").textContent = `${percentage}% Marks Scored`;
      document.getElementById("res-correct").textContent = correct;
      document.getElementById("res-incorrect").textContent = incorrect;
      document.getElementById("res-unattempted").textContent = unattempted;
      document.getElementById("res-total").textContent = total;
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Online Exam - Welcome</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-6 col-md-8">
        <div class="card shadow-sm border-0">
          <div class="card-header bg-primary text-white text-center py-3">
            <h3 class="mb-0 fw-bold">Web Development Assessment</h3>
            <small>HTML, CSS & JavaScript Fundamentals</small>
          </div>
          <div class="card-body p-4">
            <div class="row text-center mb-4 g-2">
              <div class="col-4">
                <div class="p-3 bg-light rounded border">
                  <div class="text-muted small">Total Questions</div>
                  <div class="h5 fw-bold text-dark mb-0" id="total-q">10</div>
                </div>
              </div>
              <div class="col-4">
                <div class="p-3 bg-light rounded border">
                  <div class="text-muted small">Total Time</div>
                  <div class="h5 fw-bold text-dark mb-0">10 Mins</div>
                </div>
              </div>
              <div class="col-4">
                <div class="p-3 bg-light rounded border">
                  <div class="text-muted small">Total Marks</div>
                  <div class="h5 fw-bold text-dark mb-0" id="total-m">10</div>
                </div>
              </div>
            </div>

            <form id="init-form">
              <div class="mb-3">
                <label for="candidate-name" class="form-label fw-semibold">Enter your name to start:</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                  <input type="text" id="candidate-name" class="form-control" placeholder="e.g. Vidhi Shaw, Vidhi..." required />
                  <div class="invalid-feedback">Please enter your name.</div>
                </div>
              </div>
              <div class="d-grid mt-4">
                <button type="submit" class="btn btn-primary btn-lg fw-semibold">
                  Start Examination <i class="bi bi-arrow-right-circle ms-1"></i>
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/scripts/mini-ui.js"></script>
  <script>
    localStorage.clear();
    const datastore = new FakeDatastore("exam_questions_store", "assets/questions.json");
    
    window.addEventListener("DOMContentLoaded", async () => {
      const q = await datastore.defaultValue();
      document.getElementById("total-q").textContent = q.length;
      document.getElementById("total-m").textContent = q.length;
    });

    document.getElementById("init-form").onsubmit = (e) => {
      e.preventDefault();
      const name = document.getElementById("candidate-name").value.trim();
      if (!name) {
        document.getElementById("candidate-name").classList.add("is-invalid");
        return;
      }
      
      localStorage.setItem("candidate_name", name);
      localStorage.setItem("exam_answers", JSON.stringify([]));
      window.location.href = "exam.html";
    };
  </script>
</body>
</html>

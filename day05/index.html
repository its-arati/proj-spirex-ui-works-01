<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock-Paper-Scissors</title>
    <link rel="stylesheet" href="./css/game.css">
</head>

<body>
    <div class="container">
        <h1 class="app-title">Rock Paper Scissors</h1>
        <div class="weapon-box">
            <h3>Select your weapon</h3>
            <div class="weapons">
                <div class="Rock">
                    <img src="./Images/rock.png" alt="Rock Image">
                </div>
                <div class="Paper">
                    <img src="./Images/paper.png" alt="Paper Image">
                </div>
                <div class="Scissors">
                    <img src="./Images/scissors.png" alt="Scissors Image">
                </div>
            </div>
        </div>

      <div class="player-choices">
            <h3><i>You </i> <span>v/s</span> <i>Computer</i></h3>
            <div class="player-choice">
                <img src="./Images/rock.png" alt="Rock Image">
            </div>
            <div class="computer-choice">
                <img src="./Images/rock.png" alt="Rock Image">
            </div>
        </div>

        <div class="result-box">
            <h3>Congrats, You Won!  &#x1f389;</h3>
            <button class="play-again">&#x21bb; Play Again</button>
        </div>
        
        <div class="score-box">
            <div class="won">
                <h3>Won: <span>0</span></h3>
            </div>
            <div class="lost">
                <h3>Lost: <span>0</span></h3>
            </div>
            <div class="draw">
                <h3>Draw: <span>0</span></h3>
            </div>
        </div>
    </div>

    <script src="./js/script.js"></script>
</body>

</html>
